[project]
name = "cloud-company-google-adk"
version = "0.1.0"
description = "Cloud-Company Multi-Agent System powered by Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.2.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloud_company*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
